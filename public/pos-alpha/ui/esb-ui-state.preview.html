<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SagaPOS · ESB UI State System</title>
  <link rel="stylesheet" href="/ui/esb-ui-state-system.css">
  <style>
    body { margin: 0; background: #f4eddf; color: #241a14; font-family: "Segoe UI", sans-serif; }
    main { display: grid; gap: 1rem; width: min(1120px, 100%); margin: auto; padding: clamp(1rem, 3vw, 2rem); }
    .preview-actions, .preview-form { display: flex; flex-wrap: wrap; gap: .7rem; align-items: end; }
    .preview-actions button, .preview-form button, .preview-form input { min-height: 44px; padding: .6rem .8rem; font: inherit; }
    .preview-form label { display: grid; gap: .35rem; min-width: min(100%, 18rem); font-weight: 700; }
    #preview-status { min-height: 1.5rem; margin: 0; }
  </style>
</head>
<body>
  <main>
    <header><p>Local component preview · tidak terhubung API</p><h1>ESB UI State System</h1></header>
    <div class="preview-actions" role="group" aria-label="Pilih state laporan">
      <button type="button" data-preview-state="ready">Data siap</button>
      <button type="button" data-preview-state="loading">Loading</button>
      <button type="button" data-preview-state="error">Error</button>
      <button type="button" data-preview-state="empty">Empty</button>
      <button type="button" data-preview-state="locked">Locked</button>
    </div>
    <div id="report-preview"></div>
    <form id="settings-form" class="preview-form">
      <label>Nama laporan<input name="name" value="Penjualan per kategori"></label>
      <button type="submit">Simpan perubahan</button>
      <button id="leave-report" type="button">Ganti laporan</button>
    </form>
    <p id="preview-status" role="status" aria-live="polite"></p>
  </main>
  <dialog id="unsaved-dialog" class="saga-ui-system saga-unsaved-dialog" aria-labelledby="unsaved-title" aria-describedby="unsaved-description">
    <div><h2 id="unsaved-title">Perubahan belum disimpan</h2><p id="unsaved-description">Jika berpindah sekarang, perubahan pada pengaturan laporan akan hilang.</p><div class="saga-unsaved-actions"><button type="button" data-stay>Tetap di sini</button><button type="button" data-discard>Buang dan lanjut</button></div></div>
  </dialog>
  <script type="module" src="/ui/esb-ui-state.preview.js"></script>
</body>
</html>
