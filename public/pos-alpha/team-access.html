<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tim & Akses · SagaPOS</title><link rel="stylesheet" href="/team-access.css"><script type="module" src="/team-access.js"></script></head>
<body><a class="skip" href="#content">Lewati ke konten</a><header><a href="/dashboard#settings">SagaPOS / Pengaturan</a><h1>Tim & Akses</h1><p>Akun pribadi, role bersama, dan izin sesuai tugas.</p><button id="logout" hidden>Keluar</button></header>
<main id="content"><p id="status" role="status" aria-live="polite"></p><section id="login"><h2>Masuk</h2><form id="login-form"><label>Akun<input name="login" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Masuk</button><p>Owner dapat masuk melalui dashboard, lalu membuka Tim & Akses dari Pengaturan.</p></form></section><section id="password-panel" hidden><h2>Ganti password awal</h2><form id="password-form"><label>Password awal<input name="currentPassword" type="password" autocomplete="current-password" required></label><label>Password baru (minimal 12 karakter)<input name="nextPassword" type="password" autocomplete="new-password" minlength="12" required></label><button>Simpan & masuk ulang</button></form></section><section id="workspace" hidden></section><section id="management" hidden></section></main>
</body></html>
